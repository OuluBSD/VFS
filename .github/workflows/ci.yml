name: VFS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-posix:
    name: POSIX (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang++
            bm: CLANG
          - os: ubuntu-latest
            compiler: g++
            bm: GCC
          - os: macos-latest
            compiler: clang++
            bm: CLANG_macOS

    steps:
      - name: Checkout VFS
        uses: actions/checkout@v4
        with:
          path: VFS

      - name: Checkout UppBootstrap
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBootstrap
          path: UppBootstrap

      - name: Checkout UppBuilder
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBuilder
          path: UppBuilder

      - name: Checkout BazaarCore
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/BazaarCore
          path: BazaarCore

      - name: Checkout Upstream U++ (ultimatepp)
        uses: actions/checkout@v4
        with:
          repository: ultimatepp/ultimatepp
          path: ultimatepp
          sparse-checkout: |
            mkumk_blitz.cpp
            Makefile
            uppsrc/**
          sparse-checkout-cone-mode: false

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang g++ libbz2-dev libexpat1-dev libfontconfig1-dev libfreetype-dev liblz4-dev liblzma-dev libpcre2-dev libpng-dev libjpeg-dev libx11-dev libxcb1-dev libxxhash-dev libzstd-dev zlib1g-dev libgtk-3-dev libnotify-dev xvfb

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpng lz4 pcre2 xxhash zstd xz bzip2
          echo "CPATH=/opt/homebrew/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=/opt/homebrew/lib" >> "$GITHUB_ENV"

      - name: Bootstrap umk with UppBootstrap
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cd UppBootstrap
          chmod +x ./bootstrap.sh
          ./bootstrap.sh --upp-root "$GITHUB_WORKSPACE/ultimatepp" --verbose
          echo "$GITHUB_WORKSPACE/ultimatepp/bin" >> "$GITHUB_PATH"

      - name: Bootstrap UppBuilder
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cd UppBuilder
          chmod +x ./bootstrap.sh
          ./bootstrap.sh
          echo "$GITHUB_WORKSPACE/UppBuilder" >> "$GITHUB_PATH"

      - name: Verify umk and UppBuilder
        run: |
          umk
          uppbuilder --version
          uppbuilder --help

      - name: Materialize Patched BazaarCore Assembly
        run: |
          cd BazaarCore
          uppbuilder --apply-patches --upstream "$GITHUB_WORKSPACE/ultimatepp/uppsrc" --applied-patches "$GITHUB_WORKSPACE/BazaarCore/patched-uppsrc" -v

      - name: Build & Run VfsTests (${{ matrix.bm }})
        run: |
          cd VFS
          uppbuilder tests/VfsTests -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" -v
          ./bin/VfsTests

      - name: Build & Run VfsShellTests (${{ matrix.bm }})
        run: |
          cd VFS
          uppbuilder tests/VfsShellTests -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" -v
          ./bin/VfsShellTests

      - name: Build & Run VfsExtTests (${{ matrix.bm }})
        run: |
          cd VFS
          uppbuilder tests/VfsExtTests -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" -v
          ./bin/VfsExtTests

      - name: Build & Verify Vfs/Shell CLI (${{ matrix.bm }})
        run: |
          cd VFS
          uppbuilder Vfs/Shell -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" -v
          ./bin/Shell --help
          ./bin/Shell "echo VFS Shell Online"
          ./bin/Shell "pwd"
          ./bin/Shell "echo A ; echo B"
          ./bin/Shell "true && echo LogicalAndPassed"
          ./bin/Shell "false || echo LogicalOrPassed"

      - name: Build VfsWorkbenchDemo (${{ matrix.bm }})
        run: |
          cd VFS
          uppbuilder examples/VfsWorkbenchDemo -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" -v

      - name: Run VfsWorkbenchDemo Automated Self-Test (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          cd VFS
          xvfb-run -a ./bin/VfsWorkbenchDemo --test

      - name: Run VfsWorkbenchDemo Automated Self-Test (macOS)
        if: runner.os == 'macOS'
        run: |
          cd VFS
          ./bin/VfsWorkbenchDemo --test

      - name: Build MetaCtrlDemo (${{ matrix.bm }})
        run: |
          cd VFS
          uppbuilder examples/MetaCtrlDemo -m ${{ matrix.bm }} --bazaarcore "$GITHUB_WORKSPACE/BazaarCore" -v

      - name: Run MetaCtrlDemo Automated Self-Test (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: |
          cd VFS
          xvfb-run -a ./bin/MetaCtrlDemo --test

      - name: Run MetaCtrlDemo Automated Self-Test (macOS)
        if: runner.os == 'macOS'
        run: |
          cd VFS
          ./bin/MetaCtrlDemo --test

  build-windows:
    name: Windows (windows-latest - MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout VFS
        uses: actions/checkout@v4
        with:
          path: VFS

      - name: Checkout UppBootstrap
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBootstrap
          path: UppBootstrap

      - name: Checkout UppBuilder
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/UppBuilder
          path: UppBuilder

      - name: Checkout BazaarCore
        uses: actions/checkout@v4
        with:
          repository: OuluBSD/BazaarCore
          path: BazaarCore

      - name: Checkout Upstream U++ (ultimatepp)
        uses: actions/checkout@v4
        with:
          repository: ultimatepp/ultimatepp
          path: ultimatepp
          sparse-checkout: |
            mkumk_blitz.cpp
            Makefile
            uppsrc/**
          sparse-checkout-cone-mode: false

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies via vcpkg (Windows)
        shell: cmd
        env:
          VCPKG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vcpkg install zlib:x64-windows xxhash:x64-windows lz4:x64-windows pcre2:x64-windows libpng:x64-windows libjpeg-turbo:x64-windows
          vcpkg integrate install
          copy /y "C:\vcpkg\installed\x64-windows\lib\z.lib" "C:\vcpkg\installed\x64-windows\lib\zs.lib"
          if exist "C:\vcpkg\installed\x64-windows\debug\lib\zd.lib" (
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\zd.lib" "C:\vcpkg\installed\x64-windows\debug\lib\zs.lib"
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\zd.lib" "C:\vcpkg\installed\x64-windows\debug\lib\z.lib"
          )
          copy /y "C:\vcpkg\installed\x64-windows\lib\pcre2-8.lib" "C:\vcpkg\installed\x64-windows\lib\pcre2.lib"
          if exist "C:\vcpkg\installed\x64-windows\debug\lib\pcre2-8d.lib" (
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\pcre2-8d.lib" "C:\vcpkg\installed\x64-windows\debug\lib\pcre2.lib"
          )
          copy /y "C:\vcpkg\installed\x64-windows\lib\libpng16.lib" "C:\vcpkg\installed\x64-windows\lib\png.lib"
          if exist "C:\vcpkg\installed\x64-windows\debug\lib\libpng16d.lib" (
            copy /y "C:\vcpkg\installed\x64-windows\debug\lib\libpng16d.lib" "C:\vcpkg\installed\x64-windows\debug\lib\png.lib"
          )
          echo INCLUDE=C:\vcpkg\installed\x64-windows\include;%INCLUDE%>>%GITHUB_ENV%
          echo LIB=C:\vcpkg\installed\x64-windows\lib;C:\vcpkg\installed\x64-windows\debug\lib;%LIB%>>%GITHUB_ENV%
          echo C:\vcpkg\installed\x64-windows\bin>>%GITHUB_PATH%

      - name: Bootstrap umk with UppBootstrap
        shell: cmd
        run: |
          cd UppBootstrap
          call bootstrap.cmd --upp-root "%GITHUB_WORKSPACE%\ultimatepp" --verbose
          echo %GITHUB_WORKSPACE%\ultimatepp\bin>>%GITHUB_PATH%

      - name: Bootstrap UppBuilder
        shell: cmd
        run: |
          cd UppBuilder
          call bootstrap.bat
          echo %GITHUB_WORKSPACE%\UppBuilder>>%GITHUB_PATH%

      - name: Verify umk and UppBuilder
        shell: cmd
        run: |
          umk.exe
          uppbuilder.exe --version
          uppbuilder.exe --help

      - name: Materialize Patched BazaarCore Assembly
        shell: cmd
        run: |
          cd BazaarCore
          uppbuilder.exe --apply-patches --upstream "%GITHUB_WORKSPACE%\ultimatepp\uppsrc" --applied-patches "%GITHUB_WORKSPACE%\BazaarCore\patched-uppsrc" -v

      - name: Build & Run VfsTests (MSVC)
        shell: cmd
        run: |
          cd VFS
          uppbuilder.exe tests/VfsTests -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" -v
          bin\VfsTests.exe

      - name: Build & Run VfsShellTests (MSVC)
        shell: cmd
        run: |
          cd VFS
          uppbuilder.exe tests/VfsShellTests -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" -v
          bin\VfsShellTests.exe

      - name: Build & Run VfsExtTests (MSVC)
        shell: cmd
        run: |
          cd VFS
          uppbuilder.exe tests/VfsExtTests -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" -v
          bin\VfsExtTests.exe

      - name: Build & Verify Vfs/Shell CLI (MSVC)
        shell: cmd
        run: |
          cd VFS
          uppbuilder.exe Vfs/Shell -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" -v
          bin\Shell.exe --help
          bin\Shell.exe "echo VFS Shell Online"
          bin\Shell.exe "pwd"
          bin\Shell.exe "echo A ; echo B"
          bin\Shell.exe "true && echo LogicalAndPassed"
          bin\Shell.exe "false || echo LogicalOrPassed"

      - name: Build & Run VfsWorkbenchDemo (MSVC)
        shell: cmd
        run: |
          cd VFS
          uppbuilder.exe examples/VfsWorkbenchDemo -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" -v
          bin\VfsWorkbenchDemo.exe --test

      - name: Build & Run MetaCtrlDemo (MSVC)
        shell: cmd
        run: |
          cd VFS
          uppbuilder.exe examples/MetaCtrlDemo -m MSVS22x64 --bazaarcore "%GITHUB_WORKSPACE%\BazaarCore" -v
          bin\MetaCtrlDemo.exe --test
